name: Sync event data from Google Sheet

on:
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 시트에서 행사 데이터 동기화
        run: node scripts/sync-events.mjs

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2026/data/events.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 구글 시트에서 행사 데이터 동기화"
            git push
          fi
